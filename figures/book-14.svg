<svg xmlns="http://www.w3.org/2000/svg" width="570" height="337" viewBox="0 0 570 337" role="img" aria-labelledby="title desc">
<title id="title">都只收到 r，连接经历却不同</title><desc id="desc">上下两行是两次独立运行。删除时间和尝试编号，两份录像都只剩 r；保留第 3 毫秒的超时和第二次启动，就能解释后一次为何晚到。</desc>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="570" height="337" rx="12" fill="#f7fafb"/>
<text x="19" y="33" fill="#203647" font-size="22" font-weight="680" text-anchor="start">都只收到 r，连接经历却不同</text>
<text x="19" y="72" fill="#425b68" font-size="15" font-weight="450" text-anchor="start">毫秒</text>
<text x="137.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">0</text>
<path d="M137.0 83 L137.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="263.7" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">1</text>
<path d="M263.7 83 L263.7 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="390.3" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">3</text>
<path d="M390.3 83 L390.3 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="517.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">4</text>
<path d="M517.0 83 L517.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="19" y="110" fill="#203647" font-size="16" font-weight="620" text-anchor="start">顺利时的值</text>
<path d="M123 105 L550 105" stroke="#b9cad1"/>
<path d="M545 102 L550 105" stroke="#b9cad1"/>
<path d="M545 108 L550 105" stroke="#b9cad1"/>
<rect x="248.7" y="90" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="263.7" y="110" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">r</text>
<text x="19" y="163" fill="#203647" font-size="16" font-weight="620" text-anchor="start">慢首包：尝试①</text>
<path d="M123 158 L550 158" stroke="#b9cad1"/>
<path d="M545 155 L550 158" stroke="#b9cad1"/>
<path d="M545 161 L550 158" stroke="#b9cad1"/>
<rect x="137.0" y="145" width="253.3" height="26" fill="#fff0d9"/>
<path d="M137.0 171 L390.3 171" stroke="#91491b" stroke-width="2"/>
<path d="M137.0 145 L137.0 171" stroke="#91491b" stroke-width="2"/>
<path d="M390.3 145 L390.3 171" stroke="#91491b" stroke-width="2"/>
<text x="263.65" y="163" fill="#91491b" font-size="15" font-weight="600" text-anchor="middle">等待至超时</text>
<text x="19" y="216" fill="#203647" font-size="16" font-weight="620" text-anchor="start">慢首包：尝试②</text>
<path d="M123 211 L550 211" stroke="#b9cad1"/>
<path d="M545 208 L550 211" stroke="#b9cad1"/>
<path d="M545 214 L550 211" stroke="#b9cad1"/>
<rect x="390.3" y="198" width="126.69999999999999" height="26" fill="#f2eafa"/>
<path d="M390.3 224 L517.0 224" stroke="#62438a" stroke-width="2"/>
<path d="M390.3 198 L390.3 224" stroke="#62438a" stroke-width="2"/>
<path d="M517.0 198 L517.0 224" stroke="#62438a" stroke-width="2"/>
<text x="453.65" y="216" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">等到首值</text>
<text x="19" y="269" fill="#203647" font-size="16" font-weight="620" text-anchor="start">重试后的值</text>
<path d="M123 264 L550 264" stroke="#b9cad1"/>
<path d="M545 261 L550 264" stroke="#b9cad1"/>
<path d="M545 267 L550 264" stroke="#b9cad1"/>
<rect x="502.0" y="249" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="517.0" y="269" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">r</text>
<text x="19" y="325" fill="#4e6771" font-size="13" font-weight="450" text-anchor="start">从左往右读 · 同列对齐 · 横条表示持续区间</text>
</g></svg>
