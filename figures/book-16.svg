<svg xmlns="http://www.w3.org/2000/svg" width="570" height="337" viewBox="0 0 570 337" role="img" aria-labelledby="title desc">
<title id="title">两次开启，究竟是重复连接还是重连</title><desc id="desc">比较两种故障假设。上半图检查双开时的重叠，下半图检查断线后的空档；最右只是停止观测。两份记录都可以数出两次启动。</desc>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="570" height="337" rx="12" fill="#f7fafb"/>
<text x="19" y="33" fill="#203647" font-size="22" font-weight="680" text-anchor="start">两次开启，究竟是重复连接还是重连</text>
<text x="19" y="72" fill="#425b68" font-size="15" font-weight="450" text-anchor="start">先后</text>
<text x="137.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">开列表</text>
<path d="M137.0 83 L137.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="232.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">开计数</text>
<path d="M232.0 83 L232.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="327.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">观测③</text>
<path d="M327.0 83 L327.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="422.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">观测④</text>
<path d="M422.0 83 L422.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="517.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">观测结束</text>
<path d="M517.0 83 L517.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="19" y="110" fill="#203647" font-size="16" font-weight="620" text-anchor="start">重复：连接①</text>
<path d="M123 105 L550 105" stroke="#b9cad1"/>
<path d="M545 102 L550 105" stroke="#b9cad1"/>
<path d="M545 108 L550 105" stroke="#b9cad1"/>
<rect x="137.0" y="92" width="380.0" height="26" fill="#fff0d9"/>
<path d="M137.0 118 L517.0 118" stroke="#91491b" stroke-width="2"/>
<path d="M137.0 92 L137.0 118" stroke="#91491b" stroke-width="2"/>
<path d="M517.0 92 L517.0 118" stroke="#91491b" stroke-width="2"/>
<text x="327.0" y="110" fill="#91491b" font-size="15" font-weight="600" text-anchor="middle">始终在线</text>
<text x="19" y="163" fill="#203647" font-size="16" font-weight="620" text-anchor="start">重复：连接②</text>
<path d="M123 158 L550 158" stroke="#b9cad1"/>
<path d="M545 155 L550 158" stroke="#b9cad1"/>
<path d="M545 161 L550 158" stroke="#b9cad1"/>
<rect x="232.0" y="145" width="285.0" height="26" fill="#fff0d9"/>
<path d="M232.0 171 L517.0 171" stroke="#91491b" stroke-width="2"/>
<path d="M232.0 145 L232.0 171" stroke="#91491b" stroke-width="2"/>
<path d="M517.0 145 L517.0 171" stroke="#91491b" stroke-width="2"/>
<text x="374.5" y="163" fill="#91491b" font-size="15" font-weight="600" text-anchor="middle">同时在线</text>
<text x="19" y="216" fill="#203647" font-size="16" font-weight="620" text-anchor="start">重连：连接①</text>
<path d="M123 211 L550 211" stroke="#b9cad1"/>
<path d="M545 208 L550 211" stroke="#b9cad1"/>
<path d="M545 214 L550 211" stroke="#b9cad1"/>
<rect x="137.0" y="198" width="190.0" height="26" fill="#f2eafa"/>
<path d="M137.0 224 L327.0 224" stroke="#62438a" stroke-width="2"/>
<path d="M137.0 198 L137.0 224" stroke="#62438a" stroke-width="2"/>
<path d="M327.0 198 L327.0 224" stroke="#62438a" stroke-width="2"/>
<text x="232.0" y="216" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">先在线</text>
<text x="19" y="269" fill="#203647" font-size="16" font-weight="620" text-anchor="start">重连：连接②</text>
<path d="M123 264 L550 264" stroke="#b9cad1"/>
<path d="M545 261 L550 264" stroke="#b9cad1"/>
<path d="M545 267 L550 264" stroke="#b9cad1"/>
<rect x="422.0" y="251" width="95.0" height="26" fill="#d7f4e8"/>
<path d="M422.0 277 L517.0 277" stroke="#086450" stroke-width="2"/>
<path d="M422.0 251 L422.0 277" stroke="#086450" stroke-width="2"/>
<path d="M517.0 251 L517.0 277" stroke="#086450" stroke-width="2"/>
<text x="469.5" y="269" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">恢复后在线</text>
<text x="19" y="325" fill="#4e6771" font-size="13" font-weight="450" text-anchor="start">从左往右读 · 同列对齐 · 横条表示持续区间</text>
</g></svg>
