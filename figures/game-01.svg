<svg xmlns="http://www.w3.org/2000/svg" width="598" height="284" viewBox="0 0 598 284" role="img" aria-labelledby="title desc">
<title id="title">两拍之间也能走一步</title><desc id="desc">从第三轨出发，右键在第一拍之前就松开了，第四轨仍留下了一次移动。持续按左从 60 毫秒算起，等 160 毫秒才在 220 毫秒触发第一次连移。</desc>
