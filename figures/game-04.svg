<svg xmlns="http://www.w3.org/2000/svg" width="570" height="337" viewBox="0 0 570 337" role="img" aria-labelledby="title desc">
<title id="title">暂停冻结局内拍数，继续才恢复时钟</title><desc id="desc">按第八拍实验的虚拟时刻读。16 到 25 之间没有落星时钟，拍数一直留在 8。若把保存拍数的累加器也放进时钟订阅，恢复后第二拍就不会生成星。</desc>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="570" height="337" rx="12" fill="#f7fafb"/>
<text x="19" y="33" fill="#203647" font-size="22" font-weight="680" text-anchor="start">暂停冻结局内拍数，继续才恢复时钟</text>
<text x="19" y="72" fill="#425b68" font-size="15" font-weight="450" text-anchor="start">虚拟时刻</text>
<text x="137.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">15</text>
<path d="M137.0 83 L137.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="232.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">16</text>
<path d="M232.0 83 L232.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="327.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">25</text>
<path d="M327.0 83 L327.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="422.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">26</text>
<path d="M422.0 83 L422.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="517.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">28</text>
<path d="M517.0 83 L517.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="19" y="110" fill="#203647" font-size="16" font-weight="620" text-anchor="start">操作</text>
<path d="M123 105 L550 105" stroke="#b9cad1"/>
<path d="M545 102 L550 105" stroke="#b9cad1"/>
<path d="M545 108 L550 105" stroke="#b9cad1"/>
<rect x="209.5" y="90" width="45.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="232.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">暂停</text>
<rect x="304.5" y="90" width="45.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="327.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">继续</text>
<text x="19" y="163" fill="#203647" font-size="16" font-weight="620" text-anchor="start">局内拍数</text>
<path d="M123 158 L550 158" stroke="#b9cad1"/>
<path d="M545 155 L550 158" stroke="#b9cad1"/>
<path d="M545 161 L550 158" stroke="#b9cad1"/>
<rect x="122.0" y="143" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="137.0" y="163" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">8</text>
<rect x="217.0" y="143" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="232.0" y="163" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">8</text>
<rect x="312.0" y="143" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="327.0" y="163" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">8</text>
<rect x="407.0" y="143" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="422.0" y="163" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">9</text>
<rect x="500.4" y="143" width="33.3" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="517.0" y="163" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">10</text>
<text x="19" y="216" fill="#203647" font-size="16" font-weight="620" text-anchor="start">暂停区间</text>
<path d="M123 211 L550 211" stroke="#b9cad1"/>
<path d="M545 208 L550 211" stroke="#b9cad1"/>
<path d="M545 214 L550 211" stroke="#b9cad1"/>
<rect x="232.0" y="198" width="95.0" height="26" fill="#f2eafa"/>
<path d="M232.0 224 L327.0 224" stroke="#62438a" stroke-width="2"/>
<path d="M232.0 198 L232.0 224" stroke="#62438a" stroke-width="2"/>
<path d="M327.0 198 L327.0 224" stroke="#62438a" stroke-width="2"/>
<text x="279.5" y="216" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">时钟已撤</text>
<text x="19" y="269" fill="#203647" font-size="16" font-weight="620" text-anchor="start">生成新星</text>
<path d="M123 264 L550 264" stroke="#b9cad1"/>
<path d="M545 261 L550 264" stroke="#b9cad1"/>
<path d="M545 267 L550 264" stroke="#b9cad1"/>
<rect x="487.0" y="249" width="60.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="517.0" y="269" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">第一颗</text>
<text x="19" y="325" fill="#4e6771" font-size="13" font-weight="450" text-anchor="start">从左往右读 · 同列对齐 · 横条表示持续区间</text>
</g></svg>
