<svg xmlns="http://www.w3.org/2000/svg" width="570" height="337" viewBox="0 0 570 337" role="img" aria-labelledby="title desc">
<title id="title">第一个值和最后一个值分别何时确定</title><desc id="desc">两次独立读取相同的有限序列。A 到达时，首值已经确定；B 到达时，还可能再来 C。去掉完成通知，取末值的一方仍须等待。</desc>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="570" height="337" rx="12" fill="#f7fafb"/>
<text x="19" y="33" fill="#203647" font-size="22" font-weight="680" text-anchor="start">第一个值和最后一个值分别何时确定</text>
<text x="19" y="72" fill="#425b68" font-size="15" font-weight="450" text-anchor="start">先后</text>
<text x="137.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">订阅</text>
<path d="M137.0 83 L137.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="263.7" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">发A</text>
<path d="M263.7 83 L263.7 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="390.3" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">发B</text>
<path d="M390.3 83 L390.3 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="517.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">完成</text>
<path d="M517.0 83 L517.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="19" y="110" fill="#203647" font-size="16" font-weight="620" text-anchor="start">有限来源</text>
<path d="M123 105 L550 105" stroke="#b9cad1"/>
<path d="M545 102 L550 105" stroke="#b9cad1"/>
<path d="M545 108 L550 105" stroke="#b9cad1"/>
<rect x="248.7" y="90" width="30.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="263.7" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">A</text>
<rect x="375.3" y="90" width="30.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="390.3" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">B</text>
<rect x="494.5" y="90" width="45.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="517.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">完成</text>
<text x="19" y="163" fill="#203647" font-size="16" font-weight="620" text-anchor="start">取首值订阅</text>
<path d="M123 158 L550 158" stroke="#b9cad1"/>
<path d="M545 155 L550 158" stroke="#b9cad1"/>
<path d="M545 161 L550 158" stroke="#b9cad1"/>
<rect x="137.0" y="145" width="126.69999999999999" height="26" fill="#f2eafa"/>
<path d="M137.0 171 L263.7 171" stroke="#62438a" stroke-width="2"/>
<path d="M137.0 145 L137.0 171" stroke="#62438a" stroke-width="2"/>
<path d="M263.7 145 L263.7 171" stroke="#62438a" stroke-width="2"/>
<text x="200.35" y="163" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">等待</text>
<text x="19" y="216" fill="#203647" font-size="16" font-weight="620" text-anchor="start">取末值订阅</text>
<path d="M123 211 L550 211" stroke="#b9cad1"/>
<path d="M545 208 L550 211" stroke="#b9cad1"/>
<path d="M545 214 L550 211" stroke="#b9cad1"/>
<rect x="137.0" y="198" width="380.0" height="26" fill="#f2eafa"/>
<path d="M137.0 224 L517.0 224" stroke="#62438a" stroke-width="2"/>
<path d="M137.0 198 L137.0 224" stroke="#62438a" stroke-width="2"/>
<path d="M517.0 198 L517.0 224" stroke="#62438a" stroke-width="2"/>
<text x="327.0" y="216" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">等待完成</text>
<text x="19" y="269" fill="#203647" font-size="16" font-weight="620" text-anchor="start">可确定的答案</text>
<path d="M123 264 L550 264" stroke="#b9cad1"/>
<path d="M545 261 L550 264" stroke="#b9cad1"/>
<path d="M545 267 L550 264" stroke="#b9cad1"/>
<rect x="236.6" y="249" width="54.1" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="263.7" y="269" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">首值A</text>
<rect x="489.9" y="249" width="54.1" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="517.0" y="269" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">末值B</text>
<text x="19" y="325" fill="#4e6771" font-size="13" font-weight="450" text-anchor="start">从左往右读 · 同列对齐 · 横条表示持续区间</text>
</g></svg>
