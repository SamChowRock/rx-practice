<svg xmlns="http://www.w3.org/2000/svg" width="570" height="337" viewBox="0 0 570 337" role="img" aria-labelledby="title desc">
<title id="title">从关闭按钮追到轮询器</title><desc id="desc">两种实现都能让屏幕停在第 2 行。看关闭后的下一拍：若后台还有一次轮询，就能从这条记录识别只隐藏了面板的实现。</desc>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="570" height="337" rx="12" fill="#f7fafb"/>
<text x="19" y="33" fill="#203647" font-size="22" font-weight="680" text-anchor="start">从关闭按钮追到轮询器</text>
<text x="19" y="72" fill="#425b68" font-size="15" font-weight="450" text-anchor="start">先后</text>
<text x="137.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">打开</text>
<path d="M137.0 83 L137.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="232.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">第一拍</text>
<path d="M232.0 83 L232.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="327.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">第二拍</text>
<path d="M327.0 83 L327.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="422.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">关闭</text>
<path d="M422.0 83 L422.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="517.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">下一拍</text>
<path d="M517.0 83 L517.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="19" y="110" fill="#203647" font-size="16" font-weight="620" text-anchor="start">用户操作</text>
<path d="M123 105 L550 105" stroke="#b9cad1"/>
<path d="M545 102 L550 105" stroke="#b9cad1"/>
<path d="M545 108 L550 105" stroke="#b9cad1"/>
<rect x="122.0" y="90" width="30.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="137.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">开</text>
<rect x="407.0" y="90" width="30.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="422.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">关</text>
<text x="19" y="163" fill="#203647" font-size="16" font-weight="620" text-anchor="start">轮询器</text>
<path d="M123 158 L550 158" stroke="#b9cad1"/>
<path d="M545 155 L550 158" stroke="#b9cad1"/>
<path d="M545 161 L550 158" stroke="#b9cad1"/>
<rect x="137.0" y="145" width="285.0" height="26" fill="#f2eafa"/>
<path d="M137.0 171 L422.0 171" stroke="#62438a" stroke-width="2"/>
<path d="M137.0 145 L137.0 171" stroke="#62438a" stroke-width="2"/>
<path d="M422.0 145 L422.0 171" stroke="#62438a" stroke-width="2"/>
<text x="279.5" y="163" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">独占定时器</text>
<text x="19" y="216" fill="#203647" font-size="16" font-weight="620" text-anchor="start">交给面板</text>
<path d="M123 211 L550 211" stroke="#b9cad1"/>
<path d="M545 208 L550 211" stroke="#b9cad1"/>
<path d="M545 214 L550 211" stroke="#b9cad1"/>
<rect x="217.0" y="196" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="232.0" y="216" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">1</text>
<rect x="312.0" y="196" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="327.0" y="216" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">2</text>
<text x="19" y="269" fill="#203647" font-size="16" font-weight="620" text-anchor="start">只隐藏面板</text>
<path d="M123 264 L550 264" stroke="#b9cad1"/>
<path d="M545 261 L550 264" stroke="#b9cad1"/>
<path d="M545 267 L550 264" stroke="#b9cad1"/>
<rect x="209.5" y="249" width="45.0" height="30" rx="15" fill="#fff0d9" stroke="#91491b" stroke-width="1.4"/>
<text x="232.0" y="269" fill="#91491b" font-size="15" font-weight="600" text-anchor="middle">轮询</text>
<rect x="304.5" y="249" width="45.0" height="30" rx="15" fill="#fff0d9" stroke="#91491b" stroke-width="1.4"/>
<text x="327.0" y="269" fill="#91491b" font-size="15" font-weight="600" text-anchor="middle">轮询</text>
<rect x="487.0" y="249" width="60.0" height="30" rx="15" fill="#fff0d9" stroke="#91491b" stroke-width="1.4"/>
<text x="517.0" y="269" fill="#91491b" font-size="15" font-weight="600" text-anchor="middle">仍轮询</text>
<text x="19" y="325" fill="#4e6771" font-size="13" font-weight="450" text-anchor="start">从左往右读 · 同列对齐 · 横条表示持续区间</text>
</g></svg>
