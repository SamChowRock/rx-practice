<svg xmlns="http://www.w3.org/2000/svg" width="570" height="337" viewBox="0 0 570 337" role="img" aria-labelledby="title desc">
<title id="title">同一行可以立即告警，也可以稍后归档</title><desc id="desc">第 400 毫秒的 B 同时属于告警窗口和磁盘批次。沿这一列往下读，面板已经拿到 B，磁盘要到第 1000 毫秒才拿到含 B 的数组。</desc>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="570" height="337" rx="12" fill="#f7fafb"/>
<text x="19" y="33" fill="#203647" font-size="22" font-weight="680" text-anchor="start">同一行可以立即告警，也可以稍后归档</text>
<text x="19" y="72" fill="#425b68" font-size="15" font-weight="450" text-anchor="start">毫秒</text>
<text x="137.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">100</text>
<path d="M137.0 83 L137.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="213.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">300</text>
<path d="M213.0 83 L213.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="289.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">400</text>
<path d="M289.0 83 L289.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="365.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">800</text>
<path d="M365.0 83 L365.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="441.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">900</text>
<path d="M441.0 83 L441.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="517.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">1000</text>
<path d="M517.0 83 L517.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="19" y="110" fill="#203647" font-size="16" font-weight="620" text-anchor="start">到达的行</text>
<path d="M123 105 L550 105" stroke="#b9cad1"/>
<path d="M545 102 L550 105" stroke="#b9cad1"/>
<path d="M545 108 L550 105" stroke="#b9cad1"/>
<rect x="122.0" y="90" width="30.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="137.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">A</text>
<rect x="274.0" y="90" width="30.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="289.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">B</text>
<rect x="426.0" y="90" width="30.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="441.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">C</text>
<text x="19" y="163" fill="#203647" font-size="16" font-weight="620" text-anchor="start">告警窗口</text>
<path d="M123 158 L550 158" stroke="#b9cad1"/>
<path d="M545 155 L550 158" stroke="#b9cad1"/>
<path d="M545 161 L550 158" stroke="#b9cad1"/>
<rect x="213.0" y="145" width="152.0" height="26" fill="#f2eafa"/>
<path d="M213.0 171 L365.0 171" stroke="#62438a" stroke-width="2"/>
<path d="M213.0 145 L213.0 171" stroke="#62438a" stroke-width="2"/>
<path d="M365.0 145 L365.0 171" stroke="#62438a" stroke-width="2"/>
<text x="289.0" y="163" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">保持打开</text>
<text x="19" y="216" fill="#203647" font-size="16" font-weight="620" text-anchor="start">告警面板</text>
<path d="M123 211 L550 211" stroke="#b9cad1"/>
<path d="M545 208 L550 211" stroke="#b9cad1"/>
<path d="M545 214 L550 211" stroke="#b9cad1"/>
<rect x="274.0" y="196" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="289.0" y="216" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">B</text>
<text x="19" y="269" fill="#203647" font-size="16" font-weight="620" text-anchor="start">磁盘批次</text>
<path d="M123 264 L550 264" stroke="#b9cad1"/>
<path d="M545 261 L550 264" stroke="#b9cad1"/>
<path d="M545 267 L550 264" stroke="#b9cad1"/>
<rect x="495.8" y="249" width="42.5" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="517.0" y="269" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">ABC</text>
<text x="19" y="325" fill="#4e6771" font-size="13" font-weight="450" text-anchor="start">从左往右读 · 同列对齐 · 横条表示持续区间</text>
</g></svg>
