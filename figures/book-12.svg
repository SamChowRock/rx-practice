<path d="M641 261 L646 264" stroke="#b9cad1"/>
<path d="M641 267 L646 264" stroke="#b9cad1"/>
<rect x="258.0" y="249" width="30.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
