<svg xmlns="http://www.w3.org/2000/svg" width="666" height="337" viewBox="0 0 666 337" role="img" aria-labelledby="title desc">
<title id="title">把冷源的局部时间放回全局帧</title><desc id="desc">A、B 各在自己订阅后的第 2 帧发出首值。B 从全局帧 4 才开始，所以 z 落在帧 6；同一根帧 7 的竖线同时穿过退订 B 和面板完成。</desc>
