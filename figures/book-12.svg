<path d="M409 83 L409 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="477" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">5</text>
<path d="M477 83 L477 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="545" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">6</text>
<path d="M545 83 L545 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="613" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">7</text>
<path d="M613 83 L613 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
