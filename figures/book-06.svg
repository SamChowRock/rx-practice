<svg xmlns="http://www.w3.org/2000/svg" width="570" height="443" viewBox="0 0 570 443" role="img" aria-labelledby="title desc">
<title id="title">两个请求都成功，旧结果却盖住了 B</title><desc id="desc">时刻按数字读。B 在第 5 毫秒取代 A；若保留旧订阅，第 40 毫秒屏幕会退回 A。切换策略在第 5 毫秒撤掉 A 的计时读取，只交付 B。</desc>
