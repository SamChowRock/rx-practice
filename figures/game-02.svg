<svg xmlns="http://www.w3.org/2000/svg" width="570" height="337" viewBox="0 0 570 337" role="img" aria-labelledby="title desc">
<title id="title">两次行动换序，一颗星改判</title><desc id="desc">星在第二轨第 19 行。沿上半图，碰撞读取移动后的第二轨；沿下半图，星先到落点，单星关已经结算，之后的移动没有改判机会。</desc>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="570" height="337" rx="12" fill="#f7fafb"/>
<text x="19" y="33" fill="#203647" font-size="22" font-weight="680" text-anchor="start">两次行动换序，一颗星改判</text>
<text x="19" y="72" fill="#425b68" font-size="15" font-weight="450" text-anchor="start">处理顺序</text>
<text x="137.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">初始</text>
<path d="M137.0 83 L137.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="327.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">第一步</text>
<path d="M327.0 83 L327.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="517.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">第二步</text>
<path d="M517.0 83 L517.0 299" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="19" y="110" fill="#203647" font-size="16" font-weight="620" text-anchor="start">先移动</text>
<path d="M123 105 L550 105" stroke="#b9cad1"/>
<path d="M545 102 L550 105" stroke="#b9cad1"/>
<path d="M545 108 L550 105" stroke="#b9cad1"/>
<rect x="107.0" y="90" width="60.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="137.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">第一轨</text>
<rect x="289.5" y="90" width="75.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="327.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">移到二轨</text>
<rect x="479.5" y="90" width="75.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="517.0" y="110" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">星到落点</text>
<text x="19" y="163" fill="#203647" font-size="16" font-weight="620" text-anchor="start">判分</text>
<path d="M123 158 L550 158" stroke="#b9cad1"/>
<path d="M545 155 L550 158" stroke="#b9cad1"/>
<path d="M545 161 L550 158" stroke="#b9cad1"/>
<rect x="487.0" y="143" width="60.0" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="517.0" y="163" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">得一分</text>
<text x="19" y="216" fill="#203647" font-size="16" font-weight="620" text-anchor="start">先落星</text>
<path d="M123 211 L550 211" stroke="#b9cad1"/>
<path d="M545 208 L550 211" stroke="#b9cad1"/>
<path d="M545 214 L550 211" stroke="#b9cad1"/>
<rect x="107.0" y="196" width="60.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="137.0" y="216" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">第一轨</text>
<rect x="289.5" y="196" width="75.0" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="327.0" y="216" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">星到落点</text>
<text x="19" y="269" fill="#203647" font-size="16" font-weight="620" text-anchor="start">判分</text>
<path d="M123 264 L550 264" stroke="#b9cad1"/>
<path d="M545 261 L550 264" stroke="#b9cad1"/>
<path d="M545 267 L550 264" stroke="#b9cad1"/>
<rect x="289.5" y="249" width="75.0" height="30" rx="15" fill="#fff0d9" stroke="#91491b" stroke-width="1.4"/>
<text x="327.0" y="269" fill="#91491b" font-size="15" font-weight="600" text-anchor="middle">漏接结算</text>
<text x="19" y="325" fill="#4e6771" font-size="13" font-weight="450" text-anchor="start">从左往右读 · 同列对齐</text>
</g></svg>
