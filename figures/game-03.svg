<svg xmlns="http://www.w3.org/2000/svg" width="570" height="284" viewBox="0 0 570 284" role="img" aria-labelledby="title desc">
<title id="title">同一拍里，旧星下落后才放入新星</title><desc id="desc">设此前没有漏接到结算。第 20 拍竖线上有两颗星，第一颗已下落十行，第二颗才出现。若先生成再让所有星下落，新星的位置就会差一行。</desc>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="570" height="284" rx="12" fill="#f7fafb"/>
<text x="19" y="33" fill="#203647" font-size="22" font-weight="680" text-anchor="start">同一拍里，旧星下落后才放入新星</text>
<text x="19" y="72" fill="#425b68" font-size="15" font-weight="450" text-anchor="start">局内拍数</text>
<text x="137.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">10</text>
<path d="M137.0 83 L137.0 246" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="327.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">20</text>
<path d="M327.0 83 L327.0 246" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="517.0" y="72" fill="#425b68" font-size="15" font-weight="600" text-anchor="middle">30</text>
<path d="M517.0 83 L517.0 246" stroke="#cbd8df" stroke-dasharray="3 4"/>
<text x="19" y="110" fill="#203647" font-size="16" font-weight="620" text-anchor="start">第一颗星</text>
<path d="M123 105 L550 105" stroke="#b9cad1"/>
<path d="M545 102 L550 105" stroke="#b9cad1"/>
<path d="M545 108 L550 105" stroke="#b9cad1"/>
<rect x="109.9" y="90" width="54.1" height="30" rx="15" fill="#f2eafa" stroke="#62438a" stroke-width="1.4"/>
<text x="137.0" y="110" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">第0行</text>
<rect x="295.4" y="90" width="63.3" height="30" rx="15" fill="#f2eafa" stroke="#62438a" stroke-width="1.4"/>
<text x="327.0" y="110" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">第10行</text>
<rect x="487.0" y="90" width="60.0" height="30" rx="15" fill="#f2eafa" stroke="#62438a" stroke-width="1.4"/>
<text x="517.0" y="110" fill="#62438a" font-size="15" font-weight="600" text-anchor="middle">到落点</text>
<text x="19" y="163" fill="#203647" font-size="16" font-weight="620" text-anchor="start">第二颗星</text>
<path d="M123 158 L550 158" stroke="#b9cad1"/>
<path d="M545 155 L550 158" stroke="#b9cad1"/>
<path d="M545 161 L550 158" stroke="#b9cad1"/>
<rect x="299.9" y="143" width="54.1" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="327.0" y="163" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">第0行</text>
<rect x="485.4" y="143" width="63.3" height="30" rx="15" fill="#e6eefb" stroke="#254b85" stroke-width="1.4"/>
<text x="517.0" y="163" fill="#254b85" font-size="15" font-weight="600" text-anchor="middle">第10行</text>
<text x="19" y="216" fill="#203647" font-size="16" font-weight="620" text-anchor="start">第三颗星</text>
<path d="M123 211 L550 211" stroke="#b9cad1"/>
<path d="M545 208 L550 211" stroke="#b9cad1"/>
<path d="M545 214 L550 211" stroke="#b9cad1"/>
<rect x="489.9" y="196" width="54.1" height="30" rx="15" fill="#d7f4e8" stroke="#086450" stroke-width="1.4"/>
<text x="517.0" y="216" fill="#086450" font-size="15" font-weight="600" text-anchor="middle">第0行</text>
<text x="19" y="272" fill="#4e6771" font-size="13" font-weight="450" text-anchor="start">从左往右读 · 同列对齐</text>
</g></svg>
