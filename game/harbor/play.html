<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e5"><title>雾港引航 · 月牙湾</title>
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#f3efe4;color:#203e40;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
main{width:min(1190px,94%);margin:0 auto;padding:clamp(20px,4vw,52px) 0 32px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding-bottom:20px;border-bottom:2px solid #244748}
h1,h2,p{margin:0}h1{font:800 clamp(34px,5.3vw,66px)/1.15 "Songti SC","STSong",serif;letter-spacing:.05em}header p{font-size:14px;line-height:1.7;margin-top:10px;color:#516562}
label{font-size:13px;color:#435954;white-space:nowrap}select,button{font:inherit;color:inherit}select{display:block;border:1px solid #a9b6a9;border-radius:4px;background:#fbf8ef;padding:8px 25px 8px 9px;margin-top:5px}select:disabled{opacity:.67}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;margin-top:22px;align-items:stretch}
figure{margin:0;border:1px solid #365856;border-radius:6px;background:#113642;color:#f2e7cb;overflow:hidden;align-self:start}
figcaption{display:flex;justify-content:space-between;align-items:center;background:#12343b;padding:12px 16px;border-bottom:1px solid #507371}
figcaption b,.log h2{font-size:15px;letter-spacing:.08em}.badge{font:600 13px/1.3 ui-monospace,monospace;color:#b7d9c3}
.map{position:relative}canvas{width:100%;height:auto;display:block;touch-action:manipulation}
.overlay{position:absolute;inset:0;background:#082b38a8;display:grid;align-content:center;justify-items:center;text-align:center;pointer-events:none;padding:18px}
.overlay strong{font:700 clamp(26px,4vw,48px)/1.5 "Songti SC",serif;color:#ffe4a4}.overlay span{font-size:14px}
[hidden]{display:none!important}.legend{padding:9px 16px 11px;display:flex;align-items:center;gap:18px;color:#c1d2c8;font-size:12px;border-top:1px solid #426466}.legend span{display:flex;gap:6px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #a4dfc4;background:#74b9a754}.dot.gold{background:#e6bd70;border-color:#e9c478}
.console{background:#fbf8f0;border:1px solid #afbbad;border-radius:6px;display:flex;flex-direction:column;padding:20px;gap:14px}
.console h2{font:700 23px/1.25 "Songti SC",serif}.numbers{display:grid;grid-template-columns:1fr 1fr;border-block:1px solid #cbd2c2;padding:12px 0 9px}
.numbers div+div{border-left:1px solid #cbd2c2;padding-left:18px}.numbers small,.meter-head{font-size:12px;color:#566961}.numbers b{display:block;font:600 clamp(25px,3vw,36px)/1.2 ui-monospace,monospace;color:#214647}
.meter-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px}.meter-head b{font:700 14px ui-monospace,monospace;color:#1f4645}
.track{height:22px;background:repeating-linear-gradient(to right,transparent 0 9%,#faf7e550 9% 10%),#cad5c7;border:1px solid #81988b;border-radius:3px;position:relative}
.zone,.center{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);background:#82ba9e}.center{background:#e8be73}.needle{position:absolute;top:-4px;bottom:-4px;width:3px;background:#233b3a;left:0;transform:translateX(-50%)}.needle:before{content:"";position:absolute;top:-2px;left:-3px;border:4.5px solid transparent;border-top-color:#233b3a}
.feedback{font-size:14px;line-height:1.5;min-height:2.8em;color:#365751}
button{cursor:pointer;border-radius:4px;border:1px solid #a9b8ac;background:#f8f5eb;padding:9px 11px;touch-action:manipulation;font-weight:600}
button:focus-visible,select:focus-visible{outline:3px solid #b15d37;outline-offset:3px}button:hover:enabled{filter:brightness(.96)}button:active:enabled{transform:translateY(1px)}
button:disabled{cursor:default;opacity:.45}.primary{margin-top:auto;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 0;background:#eab46c;border-color:#b67a3b;color:#243e3c;font-size:19px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{font-size:13px}.shortcuts{font-size:12px;color:#617068;line-height:1.5;text-align:center}
.log{border-top:1px solid #aebba9;margin-top:22px;padding-top:16px}.loghead{display:flex;justify-content:space-between;align-items:center}.loghead span{font:13px ui-monospace,monospace;color:#546a62}
ol{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}li{background:#e9ebdf;border:1px solid #c5cebe;border-radius:4px;padding:10px;display:flex;gap:8px;align-items:center;font-size:13px}li .num{font:600 12px ui-monospace,monospace;color:#546d60}li[data-mark="perfect"]{background:#f7e3b4}li[data-mark="lit"]{background:#d1e6d5}li[data-mark="miss"]{background:#f1d5c7}li[aria-current="step"]{border-color:#528372}
@media(max-width:840px){.layout{grid-template-columns:minmax(0,1fr) 216px;gap:12px}.console{padding:14px;gap:10px}.legend{gap:10px}.numbers{padding:8px 0}}
@media(max-width:660px){main{width:94%;padding-top:17px}header{align-items:center;padding-bottom:12px;gap:10px}header p{font-size:12px;margin-top:5px}select{max-width:92px;padding:5px}.layout{display:flex;flex-direction:column;gap:10px;margin-top:12px}figure{width:100%}figcaption{padding:8px 12px}.legend{padding:6px 12px;font-size:11px}
.console{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:9px 16px}.console h2{font-size:18px}.numbers{grid-column:2;grid-row:1 / 3;border:0;padding:0}.numbers b{font-size:23px}.meter{grid-column:1}.meter-head{margin:0 0 5px}.feedback{min-height:0;font-size:13px;grid-column:1 / -1}
.primary{font-size:17px;padding:9px}.controls button{padding:9px 4px}.shortcuts{display:none}.log{margin-top:14px;padding-top:9px}ol{gap:4px}li{display:block;text-align:center;font-size:11px;padding:5px 1px}li .num{display:block;font-size:10px}}
</style>
</head>
<body><main>
<header><div><h1>雾港引航</h1><p>引导邮船穿过五座航标。船头进绿圈时点灯，失误三次就会迷航。</p></div><label>航行难度<select id="mode"><option value="calm">缓潮</option><option value="swift">急潮</option></select></label></header>
<div class="layout"><figure><figcaption><b>月牙湾航线</b><span class="badge" id="phase">待出港</span></figcaption>
<div class="map"><canvas id="chart" width="1680" height="920" aria-label="月牙湾海图，邮船从西湾邮埠驶向东港"></canvas><div id="overlay" class="overlay" hidden><strong id="overlayTitle"></strong><span id="overlayText"></span></div></div>
<div class="legend"><span><i class="dot"></i>有效灯区</span><span><i class="dot gold"></i>标心 · 满分</span><span>西湾邮埠 → 东港</span></div></figure>
<section class="console" aria-label="引航信号台"><h2>信号台</h2>
<div class="numbers"><div><small>本航得分</small><b id="score">0</b></div><div><small>失误次数</small><b id="misses">0/3</b></div></div>
<div class="meter"><div class="meter-head">船头位置<b id="target">航标 01</b></div><div class="track" aria-hidden="true"><i class="zone" id="zone"></i><i class="center" id="center"></i><i class="needle" id="needle"></i></div></div>
<p class="feedback" role="status" id="feedback"></p><button type="button" class="primary" id="action">启航</button>
<div class="controls"><button type="button" id="pause" disabled>暂停</button><button type="button" id="restart" disabled>重新启航</button></div>
<div class="shortcuts">空格 点灯　·　P 暂停</div></section></div>
<section class="log" aria-label="航标记录"><div class="loghead"><h2>航标记录</h2><span id="record">本港最高 0 分</span></div><ol id="log"></ol></section>
