<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时日志控制台 · RxJS 实验台</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui;background:#102025;color:#ecf7f2}body{max-width:62rem;margin:auto;padding:1.5rem}h1{font-size:clamp(1.6rem,5vw,2.7rem);margin:.25rem 0}small{color:#91d6c2}fieldset,article{border:1px solid #3d605f;border-radius:.65rem;padding:1rem;margin:.8rem 0;background:#172b30}fieldset{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}button,input,select{font:inherit;background:#213d41;color:#fff;border:1px solid #73928f;border-radius:.3rem;padding:.25rem .55rem}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #75e2bb}pre{min-height:10rem;white-space:pre-wrap}output{color:#a9e8cf}aside{font-size:.92rem;color:#bbd0c9}
</style>
<small>RXJS 7.8.2　/　FIELD LAB</small><h1>实时日志控制台</h1>
<p>先预测，再操作：关掉日志面板时，计数器还开着，连接应该断吗？</p>
<fieldset><legend>任务与订阅者</legend>
<label>任务 <select id="task"><option>A</option><option>B</option></select></label>
<label><input id="panel" type="checkbox" checked>日志面板</label>
<label><input id="counter" type="checkbox" checked>错误计数</label>
<button id="drop">模拟推送断线</button><button id="inspect">检查服务端</button></fieldset>
<fieldset><legend>视图与导出</legend>
<label>搜索 <input id="query" type="search" placeholder="如：分片、error"></label>
<button id="export">导出当前视图 JSON</button></fieldset>
<fieldset><legend>逐笔保存，不随任务切换而取消</legend>
<label>备注 <input id="note" maxlength="160"></label><button id="save">入队保存</button><output id="saved"></output></fieldset>
<article><strong>连接</strong>　<output id="status">等待读取</output>　<strong>错误数</strong>　<output id="errors"></output><pre id="rows"></pre></article>
<aside id="stats">服务端只在本机运行。点击「检查服务端」查看活跃连接、累计连接和已保存备注数。</aside>
<script type="module" src="/main.js"></script></html>
